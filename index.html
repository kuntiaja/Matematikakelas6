<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpustakaan & Kuis Matematika Kelas 6</title>
<style>
:root{
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --accent: #0284c7;
  --ok: #059669;
  --no: #dc2626;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --radius: 12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.hero{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:40px 20px 60px;border-radius:0 0 24px 24px;text-align:center;box-shadow:0 4px 20px rgba(37,99,235,0.15)}
.hero h1{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:-0.3px}
.hero p{margin:8px 0 0;opacity:.9;font-size:1rem}
.chips{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,0.15);padding:6px 14px;border-radius:99px;font-size:0.85rem;font-weight:500}

main{max-width:860px;margin:-36px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0;box-shadow:var(--shadow);animation:fadeIn .3s ease both}

/* Grid Tema Utama */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tc{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .2s ease;animation:fadeIn .35s ease both;border-top:4px solid var(--primary)}
.tc:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 10px 15px -3px rgba(0,0,0,0.08)}
.tc .e{font-size:2rem;margin-bottom:8px}
.tc b{display:block;font-size:1.05rem;margin-bottom:4px;color:var(--text)}
.tc small{color:var(--muted);font-size:0.85rem}
.mini{height:6px;background:var(--border);border-radius:9px;margin-top:12px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--primary);border-radius:9px}

/* Navigasi & Tombol */
button{font:inherit;border:0;border-radius:8px;padding:10px 18px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600;transition:all .15s}
button:hover{background:var(--primary-hover)}
button.alt{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}
button.alt:hover{background:#e2e8f0}
input{font:inherit;width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);outline:none;transition:border .15s}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}

.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:2;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{background:#f1f5f9;color:var(--muted);border-radius:6px;padding:8px 14px;white-space:nowrap;font-size:0.9rem}
.tabs button.on{background:var(--primary);color:#fff}

/* Modul Perpustakaan & Sub-materi */
.sub-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;margin:12px 0}
.sub-card h4{margin:0 0 8px;color:var(--primary);font-size:1.05rem}
.rumus{background:#eff6ff;border-left:4px solid var(--primary);padding:10px 14px;margin:10px 0;border-radius:6px;font-family:Consolas,Monaco,monospace;font-size:0.9rem;color:#1e40af}
.ct{background:#fff;border-radius:8px;padding:12px;margin:10px 0;border:1px solid var(--border)}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin-top:16px;font-size:0.9rem;color:#92400e}

/* Kuis & Interaktif */
.prog{height:8px;background:var(--border);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:.3s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:10px 0;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.02)}
.opt:hover{border-color:var(--primary);background:#f8fafc}
.opt b{background:#f1f5f9;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;flex:none;font-weight:600;color:var(--muted)}
.opt.b{border-color:var(--ok);background:#ecfdf5;color:var(--ok)}
.opt.b b{background:#d1fae5;color:var(--ok)}
.opt.s{border-color:var(--no);background:#fef2f2;color:var(--no)}
.opt.s b{background:#fee2e2;color:var(--no)}

.fb{border-radius:8px;padding:12px;margin-top:14px;animation:fadeIn .25s ease both}
.fb.ok{background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
.fb.no{background:#fef2f2;color:var(--no);border:1px solid #fecaca}

.ring{width:140px;height:140px;border-radius:50%;margin:16px auto;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.ring span{background:#fff;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mu{color:var(--muted)}
.leaderboard-item{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center}
.leaderboard-item:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="hero">
  <h1>📐 Perpustakaan & Kuis Matematika Kelas 6</h1>
  <p>Pusat belajar konsep mendalam, rangkuman rumus, dan latihan terstruktur.</p>
  <div class="chips" id="chips"></div>
</div>
<main id="app"></main>

<script>
// =========================================================================
// PENTING: Masukkan URL Web App Google Apps Script Anda di dalam tanda kutip ini!
// Contoh: const API_URL = 'https://script.google.com/macros/s/AKfycb.../exec';
// =========================================================================
const API_URL = '';

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, P=a=>a[R(0,a.length-1)];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const G=(a,b)=>b?G(b,a%b):a, L=(a,b)=>a/G(a,b)*b;
const fmt=x=>typeof x==='number'?(+x.toFixed(2)+0).toLocaleString('id-ID'):x;
const f=x=>x<0?`(${x})`:x, nf=x=>x.toLocaleString('id-ID');
const fr=(a,b)=>{const d=G(a,b);a/=d;b/=d;return b==1?''+a:a+'/'+b};
const dc=x=>String(+x.toFixed(3)).replace('.',',');

function Q(q,a,e,d=[]){
  let o=[a,...d];
  if(typeof a==='number')o.push(a+Math.max(1,Math.round(Math.abs(a)*.1)),a-Math.max(1,Math.round(Math.abs(a)*.1)),a*2,a+1,a-1,a+10,a+7);
  else for(let k=0;o.length<8&&k<30;k++)o.push(fr(R(1,9),R(10,13)));
  o=[...new Set(o)].filter((x,i)=>i==0||typeof x!=='number'||a<=0||x>0).slice(0,4);
  o=sh(o);return {q,o,a:o.indexOf(a),e};
}
const pr=()=>{let a=R(4,24),b=R(4,24);while(a==b)b=R(4,24);return[a,b]};
const arr=(n,lo,hi)=>{const s=new Set();while(s.size<n)s.add(R(lo,hi));return[...s]};

const T=[
{
  n:'Bilangan Bulat', e:'➕',
  sub:[
    {
      t: '1. Konsep Dasar & Garis Bilangan',
      p: ['Bilangan bulat terdiri dari bilangan bulat negatif (..., -3, -2, -1), nol (0), dan bilangan bulat positif (1, 2, 3, ...).', 'Pada garis bilangan horizontal, semakin ke kanan nilai bilangan semakin besar. Sebaliknya, semakin ke kiri nilai semakin kecil.'],
      r: ['a > b (a lebih besar dari b jika di kanan)', 'a < b (a lebih kecil dari b jika di kiri)', '|a| = Nilai mutlak (jarak bilangan dari angka 0, selalu bernilai positif)'],
      c: [['Tentukan mana yang lebih besar antara -12 dan -5.', 'Karena -5 berada di sebelah kanan -12 pada garis bilangan, maka -5 > -12.']]
    },
    {
      t: '2. Operasi Hitung Penjumlahan & Pengurangan',
      p: ['Menjumlahkan dengan bilangan negatif sama artinya dengan melakukan pengurangan dengan bilangan positifnya.', 'Mengurangi dengan bilangan negatif sama artinya dengan menjumlahkan dengan lawan (positif) bilangan tersebut.'],
      r: ['a + (-b) = a - b', 'a - (-b) = a + b', '-a - b = -(a + b)'],
      c: [['Hitunglah: -8 + 15 = ...', 'Mulai dari titik -8 pada garis bilangan, bergerak ke kanan sejauh 15 langkah, hasilnya adalah 7.'],
          ['Hitunglah: 12 - (-6) = ...', 'Tanda minus bertemu minus menjadi plus: 12 + 6 = 18.']]
    },
    {
      t: '3. Operasi Hitung Perkalian & Pembagian',
      p: ['Aturan tanda pada perkalian dan pembagian bilangan bulat:', '• Tanda Sama (Positif × Positif atau Negatif × Negatif) → Hasil Positif.', '• Tanda Berbeda (Positif × Negatif atau Negatif × Positif) → Hasil Negatif.'],
      r: ['(+) × (+) = (+)', '(-) × (-) = (+)', '(+) × (-) = (-)', '(-) × (+) = (-)'],
      c: [['Hitunglah: (-6) × (-4) = ...', 'Dua tanda negatif dikalikan menghasilkan positif: 6 × 4 = 24.']]
    }
  ],
  tTip:'Visualisasikan garis bilangan di kepala Anda untuk soal penjumlahan/pengurangan bertanda negatif.',
  g:[
    ()=>{const a=R(-20,20),b=R(-20,20);return Q(`${a} + ${f(b)} = ...`,a+b,`${a} + ${f(b)} = ${a+b}`)},
    ()=>{const a=R(-20,20),b=R(-20,20);return Q(`${a} − ${f(b)} = ...`,a-b,`Mengurangi ${f(b)} sama dengan menambah ${-b}, sehingga hasilnya ${a-b}.`)},
    ()=>{const a=R(-9,9),b=R(-9,9);return Q(`${f(a)} × ${f(b)} = ...`,a*b,`Tanda sama → positif, tanda beda → negatif. Hasilnya ${a*b}.`)},
    ()=>{const b=R(2,9)*P([1,-1]),c=R(-9,9);return Q(`${b*c} ÷ ${f(b)} = ...`,c,`${b*c} ÷ ${f(b)} = ${c}`)},
    ()=>{const t=R(-10,10),d=R(3,15),u=R(3,15);return Q(`Suhu awal ${t}°C, turun ${d}°C, lalu naik ${u}°C. Suhu akhir = ... °C`,t-d+u,`${t} − ${d} + ${u} = ${t-d+u}`)}
  ]
},
{
  n:'Pecahan, Desimal & Persen', e:'🍰',
  sub:[
    {
      t: '1. Konsep Pecahan & Pecahan Senilai',
      p: ['Pecahan a/b menyatakan bagian dari keseluruhan, di mana a adalah pembilang dan b adalah penyebut.', 'Pecahan senilai diperoleh dengan mengalikan atau membagi pembilang dan penyebut dengan bilangan yang sama.'],
      r: ['a/b = (a × k) / (b × k)', 'Penyederhanaan dilakukan dengan membagi pembilang dan penyebut dengan FPB keduanya.'],
      c: [['Sederhanakan pecahan 24/36.', 'FPB dari 24 dan 36 adalah 12. Maka 24÷12 / 36÷12 = 2/3.']]
    },
    {
      t: '2. Operasi Hitung Pecahan',
      p: ['Penjumlahan dan pengurangan pecahan wajib menyamakan penyebut terlebih dahulu menggunakan KPK.'],
      r: ['a/b + c/d = (a·d + c·b) / (b·d)', 'a/b ÷ c/d = a/b × d/c'],
      c: [['Hitung 1/2 + 1/3 = ...', 'KPK penyebut 2 dan 3 adalah 6. (3/6) + (2/6) = 5/6.']]
    },
    {
      t: '3. Hubungan Pecahan, Desimal, dan Persen',
      p: ['Persen berarti "per seratus" (p/100). Desimal ditulis menggunakan tanda koma.'],
      r: ['p% = p / 100', 'Desimal ke Persen: Kalikan 100%'],
      c: [['Berapa bentuk persen dari 3/4?', '3/4 × 100% = 75%.']]
    }
  ],
  tTip:'Selalu pastikan penyebut sudah sama sebelum menjumlahkan atau mengurangkan pecahan.',
  g:[
    ()=>{let b=P([2,3,4,5,6,8]),d=P([2,3,4,5,6,8]);while(d==b)d=P([2,3,4,5,6,8]);const a=R(1,b-1),c=R(1,d-1),n=a*d+c*b,m=b*d;return Q(`${a}/${b} + ${c}/${d} = ...`,fr(n,m),`Samakan penyebut: (${a}×${d} + ${c}×${b}) / ${m} = ${n}/${m} = ${fr(n,m)}`)},
    ()=>{const b=P([3,4,5,6,8]),a=R(1,b-1),x=b*R(2,12);return Q(`${a}/${b} dari ${x} = ...`,x/b*a,`${x} ÷ ${b} = ${x/b}, lalu × ${a} = ${x/b*a}.`)},
    ()=>{const p=P([5,10,20,25,40,50,75]),x=P([40,80,120,200,400,600]);return Q(`${p}% dari ${x} = ...`,x*p/100,`${p}/100 × ${x} = ${x*p/100}`)},
    ()=>{const h=P([40000,60000,80000,120000,200000]),p=P([10,20,25,30,50]);return Q(`Harga baju Rp${nf(h)} diskon ${p}%. Harga yang dibayar = Rp ...`,h-h*p/100,`Potongan = ${p}% × ${nf(h)} = ${nf(h*p/100)}. Bayar = ${nf(h-h*p/100)}.`)}
  ]
},
{
  n:'KPK & FPB', e:'🔢',
  sub:[
    {
      t: '1. Kelipatan dan Faktor Bilangan',
      p: ['Faktor adalah bilangan-bilangan yang habis membagi suatu bilangan tanpa sisa.', 'Kelipatan adalah hasil kali bilangan tersebut dengan bilangan asli 1, 2, 3, dst.'],
      r: ['Faktor 12 = 1, 2, 3, 4, 6, 12', 'Kelipatan 4 = 4, 8, 12, 16, 20, ...'],
      c: [['Sebutkan faktor persekutuan dari 12 dan 18.', 'Faktor 12: {1,2,3,4,6,12}, Faktor 18: {1,2,3,6,9,18}. Persekutuannya: 1, 2, 3, 6.']]
    },
    {
      t: '2. KPK & FPB dengan Faktorisasi Prima',
      p: ['KPK: Ambil semua faktor prima dengan pangkat terbesar.', 'FPB: Ambil faktor prima yang sama dengan pangkat terkecil saja.'],
      r: ['KPK(a, b) = (a × b) / FPB(a, b)'],
      c: [['Cari KPK dari 12 dan 18.', '12 = 2² × 3, 18 = 2 × 3². Ambil pangkat terbesar: 2² × 3² = 36.']]
    }
  ],
  tTip:'Kata kunci soal cerita: "bersama-sama / bersamaan" → KPK. "dibagi rata / maksimal" → FPB.',
  g:[
    ()=>{const [a,b]=pr();return Q(`KPK dari ${a} dan ${b} adalah ...`,L(a,b),`KPK(${a}, ${b}) = ${L(a,b)}`)},
    ()=>{const [a,b]=pr();return Q(`FPB dari ${a*2} dan ${b*2} adalah ...`,G(a*2,b*2),`FPB(${a*2}, ${b*2}) = ${G(a*2,b*2)}`)},
    ()=>{let a=P([4,5,6,8,10,12]),b=P([3,5,6,9,10,15]);while(a==b)b=P([3,5,6,9,10,15]);return Q(`Lampu A menyala tiap ${a} detik, lampu B tiap ${b} detik. Keduanya menyala bersamaan setiap ... detik`,L(a,b),`Dicari KPK(${a}, ${b}) = ${L(a,b)}.`)},
    ()=>{const g=P([4,6,8,12]),m=g*R(2,5);let n=g*R(2,5);while(n==m)n=g*R(2,5);return Q(`Ada ${m} permen dan ${n} cokelat dibagi sama rata ke kantong sebanyak-banyaknya. Banyak kantong = ...`,G(m,n),`FPB(${m}, ${n}) = ${G(m,n)}.`)},
  ]
},
{
  n:'Pangkat & Akar', e:'⬆️',
  sub:[
    {
      t: '1. Kuadrat & Akar Kuadrat',
      p: ['Pangkat dua (kuadrat) adalah perkalian bilangan dengan dirinya sendiri (a² = a × a).', 'Akar kuadrat (√x) adalah kebalikan dari pangkat dua.'],
      r: ['a² = a × a', '√a² = a'],
      c: [['Berapakah nilai dari √289?', 'Karena 17 × 17 = 289, maka √289 = 17.']]
    },
    {
      t: '2. Kubik & Akar Pangkat Tiga',
      p: ['Pangkat tiga adalah perkalian bilangan sebanyak tiga kali (a³ = a × a × a).'],
      r: ['a³ = a × a × a', '³√a³ = a'],
      c: [['Berapakah ³√1728?', 'Hasilnya adalah 12 karena 12 × 12 × 12 = 1728.']]
    }
  ],
  tTip:'Menghafal bilangan kuadrat 1-25 dan kubik 1-10 akan menghemat banyak waktu.',
  g:[
    ()=>{const n=R(2,25);return Q(`${n}² = ...`,n*n,`${n} × ${n} = ${n*n}`)},
    ()=>{const n=R(2,25);return Q(`√${nf(n*n)} = ...`,n,`${n} × ${n} = ${n*n}, jadi akarnya ${n}.`)},
    ()=>{const n=R(2,10);return Q(`${n}³ = ...`,n**3,`${n} × ${n} × ${n} = ${n**3}`)},
    ()=>{const n=R(2,10);return Q(`³√${nf(n**3)} = ...`,n,`${n} × ${n} × ${n} = ${n**3}, jadi ${n}.`)}
  ]
},
{
  n:'Perbandingan & Skala', e:'🗺️',
  sub:[
    {
      t: '1. Perbandingan Senilai & Berbalik Nilai',
      p: ['Perbandingan Senilai: Jika besaran 1 naik, besaran 2 ikut naik.', 'Perbandingan Berbalik Nilai: Jika besaran 1 naik, besaran 2 turun.'],
      r: ['Senilai: a₁ / b₁ = a₂ / b₂', 'Berbalik Nilai: a₁ × b₁ = a₂ × b₂'],
      c: [['4 pekerja menyelesaikan pekerjaan dalam 12 hari. Jika 6 pekerja, berapa hari?', 'Berbalik nilai: 4 × 12 = 6 × t → t = 48 / 6 = 8 hari.']]
    },
    {
      t: '2. Skala Peta',
      p: ['Skala adalah perbandingan jarak pada peta (JP) dengan jarak sebenarnya (JS).'],
      r: ['Skala = JP : JS', 'JS = JP × penyebut skala'],
      c: [['Skala peta 1 : 200.000. Jarak di peta 5 cm. Berapa km jarak sebenarnya?', 'JS = 5 × 200.000 = 1.000.000 cm = 10 km.']]
    }
  ],
  tTip:'Ingat tangga konversi panjang: 1 km = 100.000 cm.',
  g:[
    ()=>{const k=P([100000,200000,500000,1000000]),p=R(2,12);return Q(`Skala 1 : ${nf(k)}. Jarak di peta ${p} cm. Jarak sebenarnya = ... km`,p*k/100000,`${p} × ${nf(k)} = ${nf(p*k)} cm = ${p*k/100000} km.`)},
    ()=>{const a=R(1,5),b=R(2,7),t=(a+b)*R(3,12)*1000;return Q(`Uang Rp${nf(t)} dibagi untuk A dan B dengan perbandingan ${a} : ${b}. Bagian A = Rp ...`,t/(a+b)*a,`Jumlah bagian ${a+b}. A = ${a}/${a+b} × ${nf(t)} = ${nf(t/(a+b)*a)}.`)},
    ()=>{const w=P([4,6,8,12]),d=P([6,9,12,18]);let w2=P([2,3,4,6,9,12,18,24]);while((w*d)%w2||w2==w)w2=P([2,3,4,6,9,12,18,24]);return Q(`${w} pekerja menyelesaikan proyek dalam ${d} hari. Jika ${w2} pekerja, selesai dalam ... hari`,w*d/w2,`Berbalik nilai: ${w} × ${d} = ${w*d}, lalu ${w*d} ÷ ${w2} = ${w*d/w2}.`)}
  ]
},
{
  n:'Bangun Datar & Lingkaran', e:'⭕',
  sub:[
    {
      t: '1. Keliling & Luas Bangun Datar',
      p: ['Keliling adalah jumlah seluruh panjang sisi. Luas adalah daerah di dalam bangun.'],
      r: ['Persegi Panjang: L = p × l, K = 2(p + l)', 'Segitiga: L = ½ × a × t'],
      c: [['Hitung luas segitiga alas 12 cm, tinggi 8 cm.', 'L = ½ × 12 × 8 = 48 cm².']]
    },
    {
      t: '2. Lingkaran',
      p: ['Diameter (d) = 2 × jari-jari (r). Gunakan π = 22/7 jika r kelipatan 7.'],
      r: ['Keliling = π × d', 'Luas = π × r²'],
      c: [['Hitung luas lingkaran r = 14 cm (π = 22/7).', 'L = 22/7 × 14 × 14 = 616 cm².']]
    }
  ],
  tTip:'Luas menggunakan satuan persegi (cm²), keliling menggunakan satuan panjang (cm).',
  g:[
    ()=>{const p=R(5,25),l=R(3,15);return Q(`Persegi panjang ${p} cm × ${l} cm. Luasnya = ... cm²`,p*l,`L = ${p} × ${l} = ${p*l}`)},
    ()=>{const a=2*R(2,15),t=R(3,15);return Q(`Segitiga alas ${a} cm, tinggi ${t} cm. Luasnya = ... cm²`,a*t/2,`L = ½ × ${a} × ${t} = ${a*t/2}`)},
    ()=>{const r=P([7,14,21]);return Q(`Luas lingkaran jari-jari ${r} cm (π = 22/7) = ... cm²`,22/7*r*r,`L = 22/7 × ${r} × ${r} = ${22/7*r*r}`)}
  ]
},
{
  n:'Bangun Ruang', e:'🧊',
  sub:[
    {
      t: '1. Volume Kubus & Balok',
      p: ['Volume menyatakan isi ruang tiga dimensi bersatuan kubik.'],
      r: ['Kubus: V = s³', 'Balok: V = p × l × t'],
      c: [['Hitung volume balok 10 × 5 × 4 cm.', 'V = 10 × 5 × 4 = 200 cm³.']]
    },
    {
      t: '2. Tabung & Kerucut',
      p: ['Tabung: Luas alas × tinggi. Kerucut: Sepertiga dari volume tabung.'],
      r: ['Tabung: V = π × r² × t', 'Kerucut: V = ⅓ × π × r² × t'],
      c: [['Volume tabung r = 7 cm, t = 10 cm (π = 22/7)?', 'V = 22/7 × 7² × 10 = 1.540 cm³.']]
    }
  ],
  tTip:'Samakan satuan (cm atau m) sebelum menghitung.',
  g:[
    ()=>{const s=R(2,15);return Q(`Volume kubus rusuk ${s} cm = ... cm³`,s**3,`V = ${s}³ = ${s**3}`)},
    ()=>{const p=R(3,15),l=R(2,10),t=R(2,10);return Q(`Volume balok ${p} × ${l} × ${t} cm = ... cm³`,p*l*t,`V = ${p} × ${l} × ${t} = ${p*l*t}`)},
    ()=>{const r=P([7,14]),t=R(2,15);return Q(`Volume tabung r = ${r} cm, t = ${t} cm (π = 22/7) = ... cm³`,22/7*r*r*t,`V = 22/7 × ${r}² × ${t} = ${22/7*r*r*t}`)}
  ]
},
{
  n:'Statistika (Data)', e:'📊',
  sub:[
    {
      t: '1. Mean, Median, Modus',
      p: ['Mean = Jumlah data ÷ banyak data.', 'Median = Nilai tengah data terurut.', 'Modus = Data yang sering muncul.'],
      r: ['Jangkauan = Data terbesar − Data terkecil'],
      c: [['Tentukan mean dari data: 70, 80, 90, 80, 70.', 'Jumlah = 390. Dibagi 5 = 78.']]
    }
  ],
  tTip:'Urutkan data terlebih dahulu sebelum mencari median.',
  g:[
    ()=>{const m=R(70,90),a=[0,0,0,0].map(()=>m+R(-8,8));a.push(5*m-a.reduce((x,y)=>x+y));return Q(`Rata-rata dari ${sh(a).join(', ')} adalah ...`,m,`Jumlah = ${5*m}, dibagi 5 = ${m}.`)},
    ()=>{const a=arr(5,5,50),s=[...a].sort((x,y)=>x-y);return Q(`Median dari ${a.join(', ')} adalah ...`,s[2],`Urutan: ${s.join(', ')}. Nilai tengah = ${s[2]}.`)},
    ()=>{const x=R(3,12),o=arr(4,1,15).filter(v=>v!=x).slice(0,3);return Q(`Modus dari ${sh([x,x,x,...o]).join(', ')} adalah ...`,x,`${x} muncul paling sering (3 kali).`)}
  ]
},
{
  n:'Kecepatan & Debit', e:'🚗',
  sub:[
    {
      t: '1. Jarak, Kecepatan, dan Waktu',
      p: ['Kecepatan (v) = Jarak ÷ Waktu', 'Jarak (s) = Kecepatan × Waktu', 'Waktu (t) = Jarak ÷ Kecepatan'],
      r: ['v = s / t', 's = v × t', 't = s / v'],
      c: [['Mobil melaju 60 km/jam selama 2,5 jam. Berapa jaraknya?', 'Jarak = 60 × 2,5 = 150 km.']]
    }
  ],
  tTip:'Samakan satuan waktu sebelum menghitung.',
  g:[
    ()=>{const v=P([40,50,60,72,80]),t=R(2,6);return Q(`Mobil melaju ${v} km/jam selama ${t} jam. Jarak tempuh = ... km`,v*t,`s = ${v} × ${t} = ${v*t}`)},
    ()=>{const t=R(5,25),q=R(10,40);return Q(`Bak ${q*t} liter terisi penuh dalam ${t} menit. Debit air = ... liter/menit`,q,`Debit = ${q*t} ÷ ${t} = ${q}`)},
    ()=>{const v=P([5,10,15,20,25,30]);return Q(`${v} m/detik = ... km/jam`,v*3.6,`${v} × 3,6 = ${fmt(v*3.6)}`)}
  ]
},
{
  n:'Satuan & Konversi', e:'⚖️',
  sub:[
    {
      t: '1. Konversi Satuan',
      p: ['Turun tangga satuan dikali, naik tangga satuan dibagi.'],
      r: ['1 km = 1.000 m', '1 ton = 1.000 kg', '1 jam = 60 menit'],
      c: [['Berapa meter dalam 3,5 km?', '3,5 × 1.000 = 3.500 meter.']]
    }
  ],
  tTip:'Selalu perhatikan tangga konversi satuan masing-masing besaran.',
  g:[
    ()=>{const [a,b,k]=P([['km','m',1000],['kg','gram',1000],['ton','kg',1000],['jam','menit',60],['menit','detik',60],['liter','cm³',1000],['m³','liter',1000]]),x=R(2,9);return Q(`${x} ${a} = ... ${b}`,x*k,`1 ${a} = ${nf(k)} ${b}, jadi ${x} × ${nf(k)} = ${nf(x*k)}.`)},
    ()=>{const j=R(1,5),m=P([10,15,20,30,40,45]);return Q(`${j} jam ${m} menit = ... menit`,j*60+m,`${j} × 60 + ${m} = ${j*60+m}`)}
  ]
}
];

const app=document.getElementById('app');
const S=JSON.parse(localStorage.getItem('mtk6_pro')||'{"nama":"","skor":{}}');
const save=()=>localStorage.setItem('mtk6_pro',JSON.stringify(S));
const avg=()=>{const v=Object.values(S.skor);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};

function home(){
  document.getElementById('chips').innerHTML=`<span class="chip">📚 ${T.length} Tema Utama</span><span class="chip">✅ ${Object.keys(S.skor).length} Selesai</span><span class="chip">⭐ Rata-rata ${avg()}</span>`;
  app.innerHTML=`<div class="card"><b>Selamat datang${S.nama?', '+S.nama:''}! 👋</b>
  <p class="mu" style="margin:4px 0 12px">Masukkan nama lengkap Anda untuk mencatat rekor skor.</p>
  <input placeholder="Tulis nama Anda di sini..." value="${S.nama}" oninput="S.nama=this.value;save()"></div>
  
  <h3 style="margin:22px 0 10px;padding-left:2px;font-size:1.15rem">Pilih Topik Pembelajaran:</h3>
  <div class="grid">${T.map((t,i)=>{const s=S.skor[t.n];return `<div class="tc" style="animation-delay:${i*25}ms" onclick="topik(${i})"><div class="e">${t.e}</div><b>${t.n}</b><small>${s!=null?'Skor Terbaik: '+s:'Belum dicoba'}</small><div class="mini"><i style="width:${s||0}%"></i></div></div>`}).join('')}</div>
  
  <div class="card" style="margin-top:24px"><b>🏆 Papan Peringkat Global</b><div id="lb" class="mu" style="margin-top:8px">${API_URL?'Memuat peringkat...':'Isi variabel API_URL dengan URL Apps Script untuk mengaktifkan papan peringkat online.'}</div></div>`;
  
  if(API_URL)fetch(API_URL).then(r=>r.json()).then(d=>{
    document.getElementById('lb').innerHTML=d.top.length?d.top.map((x,i)=>`<div class="leaderboard-item"><span><b>${['🥇','🥈','🥉'][i]||(i+1)+'.'}</b> ${x.nama}</span><span><b>${x.poin}</b> poin</span></div>`).join(''):'Belum ada data skor.';
  }).catch(()=>document.getElementById('lb').textContent='Gagal memuat papan peringkat.');
}

function topik(i){
  const t=T[i];
  app.innerHTML=`<button class="alt" onclick="home()">← Kembali ke Daftar Tema</button>
  <div class="card" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <span style="font-size:2.2rem">${t.e}</span>
      <div><h2 style="margin:0;font-size:1.4rem">${t.n}</h2><span class="mu">Pusat Konsep, Rumus, dan Studi Kasus</span></div>
    </div>
    
    <div style="margin-top:16px">
      ${t.sub.map(s=>`
        <div class="sub-card">
          <h4>${s.t}</h4>${s.p.map(x=>`<p style="margin:6px 0">${x}</p>`).join('')}
          ${s.r.map(x=>`<div class="rumus">${x}</div>`).join('')}
          ${s.c.map((c,ci)=>`<div class="ct"><b>Contoh ${ci+1}:</b> ${c[0]}<br><span class="mu"><b>Penyelesaian:</b> ${c[1]}</span></div>`).join('')}
        </div>
      `).join('')}
    </div>
    
    <div class="tip">💡 <b>Tips Profesional:</b> ${t.tTip}</div>
  </div>
  
  <div class="card">
    <h3>✏️ Uji Pemahaman Kompetensi</h3>
    <p class="mu" style="margin:4px 0 14px">Pilih jumlah soal latihan untuk mengevaluasi pemahaman konsep.</p>
    <div class="row">
      <button onclick="kuis(${i},5)">5 Soal (Cepat)</button>
      <button onclick="kuis(${i},10)">10 Soal (Standar)</button>
      <button onclick="kuis(${i},20)">20 Soal (Ujian)</button>
    </div>
  </div>`;
}

let Z;
function kuis(i,n){
  const t=T[i],soal=[],seen=new Set();
  for(let k=0,x=0;soal.length<n&&x<n*8;x++){
    const s=t.g[k%t.g.length]();k++;
    if(!seen.has(s.q)){seen.add(s.q);soal.push(s)}
  }
  Z={i,n:0,ok:0,soal,salah:[],lock:false};tampilKuis();
}
function tampilKuis(){
  const t=T[Z.i],s=Z.soal[Z.n];Z.lock=false;
  app.innerHTML=`<button class="alt" onclick="topik(${Z.i})">← Keluar Kuis</button>
  <div class="card" style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;font-size:0.9rem" class="mu"><span>${t.e} ${t.n}</span><span>Soal ${Z.n+1} dari ${Z.soal.length} · ✅ Benar: ${Z.ok}</span></div>
    <div class="prog" style="margin:10px 0 16px"><i style="width:${(Z.n/Z.soal.length)*100}%"></i></div>
    <h3 style="margin:0 0 16px;font-size:1.15rem">${s.q}</h3>
    ${s.o.map((o,k)=>`<button class="opt" onclick="jawab(${k})"><b>${'ABCD'[k]}</b><span>${fmt(o)}</span></button>`).join('')}
    <div id="fb"></div>
  </div>`;
}
function jawab(k){
  if(Z.lock)return;Z.lock=true;
  const s=Z.soal[Z.n],bt=document.querySelectorAll('.opt'),ok=k==s.a,last=Z.n==Z.soal.length-1;
  bt[s.a].classList.add('b');
  if(ok)Z.ok++;else{bt[k].classList.add('s');Z.salah.push(s)}
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✔ Jawaban Benar!':'✖ Belum Tepat.'}</b><br><span style="display:inline-block;margin-top:4px">${s.e}</span></div>
  <div class="row"><button onclick="${last?'selesai()':'Z.n++;tampilKuis()'}">${last?'Lihat Hasil Evaluasi 🎯':'Lanjut Soal Berikutnya →'}</button></div>`;
}
function selesai(){
  const t=T[Z.i],N=Z.soal.length,nilai=Math.round(Z.ok/N*100);
  if(S.skor[t.n]==null||nilai>S.skor[t.n])S.skor[t.n]=nilai;save();
  if(API_URL&&S.nama)fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({nama:S.nama,tema:t.n,benar:Z.ok,total:N})}).catch(()=>{});
  
  app.innerHTML=`<div class="card" style="text-align:center">
    <h2 style="margin-top:0">${nilai>=80?'🌟 Sangat Memuaskan!':nilai>=60?'👍 Kompetensi Baik!':'💪 Perlu Peningkatan Latihan!'}</h2>
    <div class="ring" style="background:conic-gradient(var(--ok) ${nilai*3.6}deg,var(--border) 0)"><span>${nilai}</span></div>
    <p style="font-size:1.05rem">Menjawab benar <b>${Z.ok}</b> dari <b>${N}</b> soal latihan.</p>
    <div class="row" style="justify-content:center"><button onclick="kuis(${Z.i},${N})">🔁 Ulangi Latihan</button><button class="alt" onclick="topik(${Z.i})">📖 Tinjau Materi</button><button class="alt" onclick="home()">🏠 Menu Utama</button></div>
  </div>
  ${Z.salah.length?`<div class="card"><h3>📝 Catatan Evaluasi (Soal yang Keliru)</h3>${Z.salah.map(s=>`<div class="ct">${s.q}<br><b>Jawaban Benar: ${fmt(s.o[s.a])}</b><br><span class="mu">${s.e}</span></div>`).join('')}</div>`:''}`;
}

home();
</script>
</body>
</html>
